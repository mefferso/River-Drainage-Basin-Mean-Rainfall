name: Validate basin rainfall application
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt geopandas pyproj
      - run: python -m compileall -q scripts
      - run: python -m unittest discover -s tests -v
      - run: node tests/validate-ui.cjs
      - run: node tests/test_historical_ui.cjs
      - run: node tests/test_phase4a_map.cjs
      - run: node tests/test_phase4b_map.cjs
      - run: python -m unittest -v tests/test_phase4b_workflow_contract.py
