name: Update MRMS basin rainfall
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'config/**'
      - 'requirements.txt'
      - '.github/workflows/update.yml'
  schedule:
    - cron: '27 * * * *'
permissions:
  contents: write
concurrency:
  group: mrms-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Unit tests
        run: |
          python -m compileall -q scripts
          python -m unittest discover -s tests -v
          node tests/validate-ui.cjs
      - name: Run basin rainfall update
        run: python scripts/update.py
      - name: Commit generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "Update hourly MRMS basin rainfall"
            # Other documentation/code commits can arrive while MRMS downloads run.
            # Rebase the generated-data commit rather than force-pushing.
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                exit 0
              fi
              sleep 2
            done
            echo "Could not publish generated MRMS data after 3 attempts" >&2
            exit 1
          fi
