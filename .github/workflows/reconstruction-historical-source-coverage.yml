name: Phase 4B historical precipitation source coverage
on:
  push:
    branches: [feature/pilot-rainfall-reconstruction-amil1-mnlm6]
    paths:
      - 'reconstruction/probe_historical_qpe.py'
      - '.github/workflows/reconstruction-historical-source-coverage.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  historical-qpe-source-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Probe actual MRMS hourly inventories and NOAA Stage IV dated archives
        run: |
          python reconstruction/probe_historical_qpe.py \
            --output reconstruction/staging/historical_qpe_coverage.json
      - name: Upload source-availability audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase4b-archive-coverage
          path: reconstruction/staging/historical_qpe_coverage.json
          retention-days: 30
          if-no-files-found: warn
