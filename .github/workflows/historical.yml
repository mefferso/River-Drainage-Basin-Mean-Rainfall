name: Historical Oct 31-Nov 1 2026 MRMS test
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/historical.py'
      - '.github/workflows/historical.yml'
permissions:
  contents: write
concurrency:
  group: mrms-historical-event
  cancel-in-progress: false
jobs:
  historical:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Process historical event (no missing-hour substitution)
        run: python scripts/historical.py
      - name: Publish historical event files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add historical/2026-10-31_2026-11-01/
          if ! git diff --cached --quiet; then
            git commit -m "Publish verified Oct 31-Nov 1 2026 MRMS historical experiment"
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                exit 0
              fi
              sleep 3
            done
            exit 1
          fi
