name: Phase 4B NOAA Stage IV archive member audit
on:
  push:
    branches: [feature/pilot-rainfall-reconstruction-amil1-mnlm6]
    paths:
      - 'reconstruction/inspect_stageiv.py'
      - '.github/workflows/reconstruction-stageiv-inspection.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stageiv-archive-inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install retrieval dependency
        run: python -m pip install 'requests>=2.31,<3'
      - name: Retrieve actual archive tar members and hashes
        run: |
          python reconstruction/inspect_stageiv.py \
            --output reconstruction/staging/stageiv_member_audit.json
      - name: Retain reproducible source audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase4b-stageiv-member-audit
          path: reconstruction/staging/stageiv_member_audit.json
          retention-days: 30
          if-no-files-found: warn
