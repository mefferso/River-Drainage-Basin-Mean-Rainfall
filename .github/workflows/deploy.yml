name: Deploy basin dashboard to Pages
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'historical-ui.js'
      - 'historical/**'
      - 'reports/phase4a/**'
      - 'docs/PHASE4A_NETWORK_BASIN_GEOMETRY_HANDOFF.md'
      - 'reports/phase4b/**'
      - 'docs/PHASE4B_HISTORICAL_MAP_RECONSTRUCTION.md'
      - 'README.md'
      - '.github/workflows/deploy.yml'
  workflow_run:
    workflows: ["Update MRMS basin rainfall", "Historical Oct 31-Nov 1 2026 MRMS test"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - uses: actions/deploy-pages@v4
        id: deployment
