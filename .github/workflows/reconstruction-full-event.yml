name: Independently verify full 49h Oct 2026 MRMS event
on:
  push:
    branches:
      - feature/pilot-rainfall-reconstruction-amil1-mnlm6
    paths:
      - reconstruction/verify_oct2026.py
      - .github/workflows/reconstruction-full-event.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-49h:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install geospatial dependencies
        run: python -m pip install -r requirements.txt
      - name: Retrieve all 49 historical MRMS Pass2 hourly source grids
        run: |
          python reconstruction/archive_qpe.py \
            --start 2026-10-31T05:00:00Z \
            --end 2026-11-02T06:00:00Z \
            --out reconstruction/staging/forty_nine_hour \
            --download
      - name: Independently recalculate upstream basin rainfall
        run: |
          python reconstruction/verify_oct2026.py \
            --manifest reconstruction/staging/forty_nine_hour/qpe_manifest.csv \
            --basins historical/2026-10-31_2026-11-01/basins.geojson \
            --reference historical/2026-10-31_2026-11-01/latest.json \
            --output reconstruction/staging/49h_map_reproduction.json
      - name: Publish audit artifacts, not synthetic historical events
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pilot-49h-independent-map-audit
          path: |
            reconstruction/staging/49h_map_reproduction.json
            reconstruction/staging/forty_nine_hour/archive_inventory.json
            reconstruction/staging/forty_nine_hour/qpe_manifest.csv
          if-no-files-found: warn
          retention-days: 30
