name: Phase 4C historical Stage IV native-grid daily MAP
on:
  push:
    branches: [feature/pilot-rainfall-reconstruction-amil1-mnlm6]
    paths:
      - reconstruction/stageiv_daily_map.py
      - reconstruction/tests/test_stageiv_daily_map.py
      - .github/workflows/reconstruction-stageiv-daily-map.yml
      - requirements.txt
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-stageiv-map:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify daily source timing, native grid weighting and missing pixel behavior
        run: python -m unittest discover -s reconstruction/tests -v
      - name: Retrieve and calculate official 2016, 2018 and 2019 daily Stage IV QPE
        run: |
          python reconstruction/stageiv_daily_map.py \
            --dates 2016-03-12 2018-12-28 2019-05-12 \
            --output reconstruction/staging/stageiv_daily_map_audit.json
      - name: Retain actual daily MAP audit without publishing event dots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase4c-stageiv-daily-maps
          path: reconstruction/staging/stageiv_daily_map_audit.json
          retention-days: 30
          if-no-files-found: warn
